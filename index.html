<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lathe – parametric vase generator for 3D printing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9ecef;--panel:#fff;--ink:#16191d;--mute:#5d6671;--line:#d5dae0;--acc:#2a55e5;--accink:#fff;--view:#dfe4ea;--ok:#157f4f;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1115;--panel:#171b21;--ink:#e9ecf0;--mute:#98a2ae;--line:#272d36;--acc:#7f9cff;--accink:#0b1020;--view:#12161b;--ok:#5fd29b;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1115;--panel:#171b21;--ink:#e9ecf0;--mute:#98a2ae;--line:#272d36;--acc:#7f9cff;--accink:#0b1020;--view:#12161b;--ok:#5fd29b;--bad:#ff8a80}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:320px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 18px 28px}
h1{font-size:20px;margin:0 0 2px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 16px;font-size:13px}
h2{font-size:13px;font-weight:600;margin:20px 0 8px;color:var(--mute)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 10px;border-radius:999px}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.row{margin:10px 0}
.row label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.row output{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--mute);font-size:12px}
input[type=range]{width:100%;accent-color:var(--acc);margin:0}
.chk{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px}
.chk input{accent-color:var(--acc)}
input[type=color]{border:1px solid var(--line);background:none;width:34px;height:24px;padding:0;border-radius:4px}
main{position:relative;min-width:0;min-height:0;background:var(--view)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
.hud{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;pointer-events:none}
.stats{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;display:grid;grid-template-columns:repeat(2,auto);gap:2px 18px;flex:1 1 260px}
.stats span{color:var(--mute)}
.stats b{font-weight:500;text-align:right}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.exp{pointer-events:auto;background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:12px 18px;font-weight:600;flex:0 0 auto}
.exp:hover{filter:brightness(1.08)}
.hint{position:absolute;top:12px;left:14px;color:var(--mute);font-size:12px;pointer-events:none}
.msg{position:absolute;top:12px;right:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;max-width:min(320px,70%);display:none}
@media (max-width:760px){
 .app{grid-template-columns:1fr;grid-template-rows:58% 42%;height:100%}
 main{order:-1}
 aside{border-right:0;border-top:1px solid var(--line)}
 .hud{left:8px;right:8px;bottom:8px}
 .stats{font-size:11px;padding:8px 10px}
}
</style>
</head>
<body>
<div class="app">
<aside>
 <h1>Lathe</h1>
 <p class="sub">Shape a vase or pen cup, then export a print-ready mesh.</p>
 <h2>Start from</h2>
 <div class="presets" id="presets"></div>
 <h2>Silhouette</h2><div id="g1"></div>
 <h2>Surface</h2><div id="g2"></div>
 <h2>Walls</h2>
 <label class="chk"><input type="checkbox" id="solid"> Solid body (no cavity)</label>
 <div id="g3"></div>
 <h2>Preview</h2>
 <label class="chk"><input type="checkbox" id="wire"> Show mesh</label>
 <label class="chk">Colour <input type="color" id="col" value="#4f7cff"></label>
 <h2>Variations</h2>
 <div class="presets"><button class="chip" id="rnd">Surprise me</button></div>
</aside>
<main>
 <canvas id="cv"></canvas>
 <div class="hint">Drag to orbit · scroll or pinch to zoom</div>
 <div class="msg" id="msg"></div>
 <div class="hud">
  <div class="stats">
   <span>Size</span><b id="sSize"></b>
   <span>Triangles</span><b id="sTri"></b>
   <span>Material volume</span><b id="sVol"></b>
   <span>PLA, solid infill</span><b id="sWt"></b>
   <span>Mesh check</span><b id="sWt2"></b>
  </div>
  <button class="exp" id="export">Download STL + OBJ (.zip)</button>
 </div>
</main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const DEF={height:120,baseR:28,midR:42,midPos:0.45,topR:30,ridges:10,ridgeD:0.06,twist:0.5,wall:2,floorT:3,seg:96,solid:false};
const PRE={
 'Twisted vase':DEF,
 'Pen cup':{height:100,baseR:36,midR:38,midPos:0.5,topR:37,ridges:0,ridgeD:0,twist:0,wall:2.4,floorT:4,seg:96,solid:false},
 'Fluted tower':{height:170,baseR:24,midR:30,midPos:0.3,topR:22,ridges:16,ridgeD:0.1,twist:0,wall:1.6,floorT:2.5,seg:128,solid:false},
 'Wide bowl':{height:60,baseR:22,midR:62,midPos:0.6,topR:58,ridges:6,ridgeD:0.04,twist:-0.3,wall:2.4,floorT:3,seg:96,solid:false},
 'Spiral candle':{height:140,baseR:26,midR:30,midPos:0.5,topR:26,ridges:5,ridgeD:0.14,twist:1.5,wall:2,floorT:2,seg:128,solid:true}
};
const GROUPS={g1:[['height','Height',40,200,1,' mm'],['baseR','Base radius',10,60,1,' mm'],['midR','Belly radius',10,80,1,' mm'],['midPos','Belly position',0.1,0.9,0.01,''],['topR','Rim radius',8,70,1,' mm']],
 g2:[['ridges','Ridges',0,24,1,''],['ridgeD','Ridge depth',0,0.3,0.01,''],['twist','Twist',-2,2,0.05,' turns'],['seg','Smoothness',24,160,4,'']],
 g3:[['wall','Wall thickness',0.8,6,0.2,' mm'],['floorT','Floor thickness',1,8,0.5,' mm']]};
const P=Object.assign({},DEF);
const ctl={};
function mk(gid,list){const box=document.getElementById(gid);list.forEach(([k,l,mn,mx,st,u])=>{
 const r=document.createElement('div');r.className='row';
 r.innerHTML='<label for="i_'+k+'">'+l+'<output id="o_'+k+'"></output></label><input type="range" id="i_'+k+'" min="'+mn+'" max="'+mx+'" step="'+st+'">';
 box.appendChild(r);const inp=r.querySelector('input'),out=r.querySelector('output');
 ctl[k]={inp,out,u,st};
 inp.addEventListener('input',()=>{P[k]=parseFloat(inp.value);sync();schedule();markPreset(null)});
});}
Object.entries(GROUPS).forEach(([g,l])=>mk(g,l));
function sync(){for(const k in ctl){const c=ctl[k];c.inp.value=P[k];const d=c.st<1?(c.st<0.1?2:1):0;c.out.textContent=(+P[k]).toFixed(d)+c.u}
 document.getElementById('solid').checked=!!P.solid}
const pbox=document.getElementById('presets');
function markPreset(n){pbox.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.textContent===n))}
Object.keys(PRE).forEach(n=>{const b=document.createElement('button');b.className='chip';b.textContent=n;
 b.onclick=()=>{Object.assign(P,PRE[n]);sync();rebuild();markPreset(n)};pbox.appendChild(b)});
document.getElementById('solid').onchange=e=>{P.solid=e.target.checked;rebuild();markPreset(null)};
document.getElementById('rnd').onclick=()=>{const r=(a,b)=>a+Math.random()*(b-a);
 const rs=Math.random()<.3?0:Math.round(r(3,18));
 Object.assign(P,{height:Math.round(r(70,180)),baseR:Math.round(r(16,40)),midR:Math.round(r(24,60)),midPos:+r(.25,.7).toFixed(2),topR:Math.round(r(16,50)),ridges:rs,ridgeD:rs?+r(.03,.16).toFixed(2):0,twist:+(Math.round(r(-15,15))/10).toFixed(1)});
 sync();rebuild();markPreset(null)};

/* ---------- geometry ---------- */
let V=null,F=null; // positions (Float32Array), indices (Uint32Array), y-up mm
function generate(){
 const H=P.height,M=P.seg|0,N=90,tf=Math.min(P.floorT/H,0.6);
 const ss=x=>x*x*(3-2*x);
 const R=t=>t<P.midPos?P.baseR+(P.midR-P.baseR)*ss(t/P.midPos):P.midR+(P.topR-P.midR)*ss((t-P.midPos)/(1-P.midPos));
 const d=P.ridges?P.ridgeD:0;
 const rad=(t,a)=>R(t)*(1+d*Math.sin(P.ridges*a+P.twist*6.283185*t));
 const pos=[],idx=[];
 for(let i=0;i<=N;i++){const t=i/N;for(let j=0;j<M;j++){const a=6.283185*j/M,r=rad(t,a);pos.push(r*Math.cos(a),t*H,r*Math.sin(a))}}
 const cB=pos.length/3;pos.push(0,0,0);
 const O=(i,j)=>i*M+(j%M);
 let I=null,cF=0,cT=0;
 if(!P.solid){const base=pos.length/3;
  for(let i=0;i<=N;i++){const t=tf+(1-tf)*i/N;for(let j=0;j<M;j++){const a=6.283185*j/M,r=Math.max(rad(t,a)-P.wall,0.4);pos.push(r*Math.cos(a),t*H,r*Math.sin(a))}}
  cF=pos.length/3;pos.push(0,tf*H,0);I=(i,j)=>base+i*M+(j%M);
 }else{cT=pos.length/3;pos.push(0,H,0)}
 for(let i=0;i<N;i++)for(let j=0;j<M;j++){const a=O(i,j),b=O(i+1,j),c=O(i,j+1),e=O(i+1,j+1);idx.push(a,b,c,c,b,e);
  if(I){const A=I(i,j),B=I(i+1,j),C=I(i,j+1),E=I(i+1,j+1);idx.push(A,C,B,C,E,B)}}
 for(let j=0;j<M;j++){idx.push(cB,O(0,j),O(0,j+1));
  if(I){idx.push(cF,I(0,j+1),I(0,j));idx.push(I(N,j),I(N,j+1),O(N,j),I(N,j+1),O(N,j+1),O(N,j))}
  else idx.push(cT,O(N,j+1),O(N,j));}
 V=new Float32Array(pos);F=new Uint32Array(idx);
}
function analyse(){
 let vol=0,mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9,mxy=0;
 for(let i=0;i<V.length;i+=3){mnx=Math.min(mnx,V[i]);mxx=Math.max(mxx,V[i]);mnz=Math.min(mnz,V[i+2]);mxz=Math.max(mxz,V[i+2]);mxy=Math.max(mxy,V[i+1])}
 const NV=V.length/3,set=new Set();
 for(let i=0;i<F.length;i+=3){const a=F[i]*3,b=F[i+1]*3,c=F[i+2]*3;
  vol+=(V[a]*(V[b+1]*V[c+2]-V[b+2]*V[c+1])-V[a+1]*(V[b]*V[c+2]-V[b+2]*V[c])+V[a+2]*(V[b]*V[c+1]-V[b+1]*V[c]))/6;
  for(let k=0;k<3;k++)set.add(F[i+k]*NV+F[i+(k+1)%3]);}
 let bad=0;for(const key of set){const u=Math.floor(key/NV),v=key-u*NV;if(!set.has(v*NV+u))bad++}
 const cm3=Math.abs(vol)/1000;
 sSize.textContent=(mxx-mnx).toFixed(0)+' × '+(mxz-mnz).toFixed(0)+' × '+mxy.toFixed(0)+' mm';
 sTri.textContent=(F.length/3).toLocaleString('en-US');
 sVol.textContent=cm3.toFixed(1)+' cm³';
 sWt.textContent=(cm3*1.24).toFixed(0)+' g';
 sWt2.textContent=bad?bad+' open edges':'Watertight';
 sWt2.className=bad?'bad':'ok';
}
const $=id=>document.getElementById(id);
const sSize=$('sSize'),sTri=$('sTri'),sVol=$('sVol'),sWt=$('sWt'),sWt2=$('sWt2');

/* ---------- three.js view ---------- */
const cv=$('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(35,1,1,3000);
scene.add(new THREE.HemisphereLight(0xffffff,0x555a66,0.75));
const key=new THREE.DirectionalLight(0xffffff,0.9);key.position.set(120,220,160);scene.add(key);
const rim=new THREE.DirectionalLight(0xffffff,0.35);rim.position.set(-150,80,-120);scene.add(rim);
const grid=new THREE.GridHelper(220,22,0x7d8794,0x9aa3ae);grid.material.transparent=true;grid.material.opacity=0.45;scene.add(grid);
const mat=new THREE.MeshStandardMaterial({color:0x4f7cff,roughness:0.5,metalness:0.05,side:THREE.DoubleSide});
const mesh=new THREE.Mesh(new THREE.BufferGeometry(),mat);scene.add(mesh);
let th=0.7,ph=1.15,dist=320,tgt=new THREE.Vector3(0,60,0),need=true;
function place(){const s=Math.sin(ph);cam.position.set(tgt.x+dist*s*Math.sin(th),tgt.y+dist*Math.cos(ph),tgt.z+dist*s*Math.cos(th));cam.lookAt(tgt)}
function resize(){const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();need=true}
function draw(){need=false;place();renderer.render(scene,cam)}
(function loop(){if(need)draw();requestAnimationFrame(loop)})();
new ResizeObserver(resize).observe(cv);
let pts=new Map(),lastD=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);lastD=0});
cv.addEventListener('pointerup',e=>pts.delete(e.pointerId));
cv.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
 if(pts.size===1){th-=(e.clientX-p[0])*0.008;ph=Math.min(3.0,Math.max(0.1,ph-(e.clientY-p[1])*0.008))}
 pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(lastD)dist=Math.min(900,Math.max(80,dist*lastD/d));lastD=d}
 need=true});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.min(900,Math.max(80,dist*Math.exp(e.deltaY*0.001)));need=true},{passive:false});
$('wire').onchange=e=>{mat.wireframe=e.target.checked;need=true};
$('col').oninput=e=>{mat.color.set(e.target.value);need=true};

function rebuild(){
 generate();
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(V,3));
 g.setIndex(new THREE.BufferAttribute(F,1));
 g.computeVertexNormals();
 mesh.geometry.dispose();mesh.geometry=g;
 tgt.y=P.height/2;analyse();need=true;
}
let pend=0;function schedule(){if(pend)return;pend=requestAnimationFrame(()=>{pend=0;rebuild()})}

/* ---------- export ---------- */
function enc(s){return new TextEncoder().encode(s)}
function toStl(){ // binary STL, Z-up for slicers
 const n=F.length/3,buf=new ArrayBuffer(84+n*50),dv=new DataView(buf);
 enc('Lathe parametric vase').forEach((b,i)=>dv.setUint8(i,b));dv.setUint32(80,n,true);
 let o=84;const c=i=>[V[i*3],-V[i*3+2],V[i*3+1]];
 for(let t=0;t<n;t++){const A=c(F[t*3]),B=c(F[t*3+1]),C=c(F[t*3+2]);
  const u=[B[0]-A[0],B[1]-A[1],B[2]-A[2]],v=[C[0]-A[0],C[1]-A[1],C[2]-A[2]];
  let nx=u[1]*v[2]-u[2]*v[1],ny=u[2]*v[0]-u[0]*v[2],nz=u[0]*v[1]-u[1]*v[0];const l=Math.hypot(nx,ny,nz)||1;
  [nx/l,ny/l,nz/l,...A,...B,...C].forEach(x=>{dv.setFloat32(o,x,true);o+=4});o+=2}
 return new Uint8Array(buf);
}
function toObj(){const L=['# Lathe parametric vase (mm, Z-up)','o vase'];
 for(let i=0;i<V.length;i+=3)L.push('v '+V[i].toFixed(4)+' '+(-V[i+2]).toFixed(4)+' '+V[i+1].toFixed(4));
 for(let i=0;i<F.length;i+=3)L.push('f '+(F[i]+1)+' '+(F[i+1]+1)+' '+(F[i+2]+1));
 return enc(L.join('\n')+'\n');}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){const parts=[],cen=[];let off=0;
 files.forEach(f=>{const nm=enc(f.name),cr=crc(f.data),h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,cr,true);h.setUint32(18,f.data.length,true);h.setUint32(22,f.data.length,true);h.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(h.buffer),nm,f.data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,cr,true);c.setUint32(20,f.data.length,true);c.setUint32(24,f.data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cen.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+f.data.length});
 const csz=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'});}
const msg=$('msg');let mt=0;
function say(t){msg.textContent=t;msg.style.display='block';clearTimeout(mt);mt=setTimeout(()=>msg.style.display='none',5000)}
$('export').onclick=async()=>{
 const blob=zip([{name:'lathe-vase.stl',data:toStl()},{name:'lathe-vase.obj',data:toObj()},{name:'lathe-parameters.json',data:enc(JSON.stringify(P,null,2))}]);
 let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename:'lathe-vase.zip',data:blob});say('Saved. The zip holds the STL, OBJ and your settings.')}catch(e){if(e&&e.code!=='declined')say('Download unavailable here: '+(e.message||e.code))}}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lathe-vase.zip';document.body.appendChild(a);a.click();a.remove();say('Zip ready with STL, OBJ and settings.')}
};
sync();markPreset('Twisted vase');rebuild();resize();
})();
</script>
</body>
</html>
